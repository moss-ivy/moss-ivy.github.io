<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hero2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051529"/>
      <stop offset="60%" stop-color="#081e3a"/>
      <stop offset="100%" stop-color="#020a14"/>
    </linearGradient>

    <radialGradient id="lumGlow" cx="55%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffdf87" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#051529" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#hero2Bg)"/>
  <rect width="800" height="500" fill="url(#lumGlow)"/>

  <!-- Orbitální zlaté prstence -->
  <g transform="translate(140, 10)">
    <ellipse cx="380" cy="240" rx="220" ry="80" fill="none" stroke="#eac875" stroke-width="7" transform="rotate(-18 380 240)"/>
    <ellipse cx="380" cy="235" rx="200" ry="70" fill="none" stroke="#fff1bd" stroke-width="6" transform="rotate(32 380 235)"/>
    <ellipse cx="380" cy="245" rx="190" ry="60" fill="none" stroke="#d4af37" stroke-width="5.5" transform="rotate(-52 380 245)"/>
    <ellipse cx="382" cy="238" rx="150" ry="50" fill="none" stroke="#ffffff" stroke-width="4" transform="rotate(68 382 238)"/>
  </g>

  <!-- Hvězdné / světelné akcenty -->
  <circle cx="340" cy="210" r="5" fill="#ffffff"/>
  <circle cx="580" cy="280" r="6" fill="#ffffff"/>
  <circle cx="460" cy="170" r="4" fill="#ffefa8"/>

  <text x="50" y="440" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" fill="#eac875" letter-spacing="2">
    KINETIC LUMINARIES
  </text>
  <text x="50" y="465" font-family="'Outfit', sans-serif" font-size="12" fill="#8ca8c9" letter-spacing="4">
    CELESTIAL &amp; AMBIENT ILLUMINATION
  </text>
</svg>

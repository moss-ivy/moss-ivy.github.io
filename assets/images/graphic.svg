    <!-- Karta 1 -->
    <rect x="0" y="30" width="140" height="180" rx="8" fill="#e29aa7" opacity="0.95" transform="rotate(-6 0 30)"/>
    <text x="25" y="70" font-family="'Cormorant Garamond', serif" font-size="20" fill="#501526" font-weight="bold" transform="rotate(-6 0 30)">IVANA</text>
    <line x1="25" y1="85" x2="115" y2="85" stroke="#501526" stroke-width="2" transform="rotate(-6 0 30)"/>
    <rect x="25" y="105" width="85" height="6" rx="3" fill="#501526" opacity="0.6" transform="rotate(-6 0 30)"/>
    <rect x="25" y="120" width="65" height="6" rx="3" fill="#501526" opacity="0.6" transform="rotate(-6 0 30)"/>

    <!-- Karta 2 -->
    <rect x="120" y="20" width="150" height="190" rx="8" fill="#9fb399" opacity="0.9" transform="rotate(8 120 20)"/>
    <text x="145" y="65" font-family="'Cormorant Garamond', serif" font-size="18" fill="#501526" font-weight="bold" transform="rotate(8 120 20)">DESIGN</text>
    <circle cx="215" cy="120" r="28" fill="#501526" opacity="0.15" transform="rotate(8 120 20)"/>

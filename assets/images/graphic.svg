      <stop offset="0%" stop-color="#4a1827"/>
      <stop offset="100%" stop-color="#240710"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#gBg)"/>

  <!-- Tiskové a knižní layouty / typografie -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Pozadí stolu a stěny -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ebe5dc"/>
      <stop offset="68%" stop-color="#dfd6c8"/>
      <stop offset="70%" stop-color="#c4b69f"/>
      <stop offset="100%" stop-color="#b09f85"/>
    </linearGradient>

    <!-- Skleněná azurová váza -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e83a0" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#0d6782" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#05485c" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#032e3b"/>
    </linearGradient>
    
    <linearGradient id="glassRib" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ad1f5" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0b586e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#148ea8" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="waterHighlight" cx="40%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#56e2ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#032e3b" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Pozadí studia / stěna a dubový stůl -->
  <rect width="400" height="480" fill="url(#wallGrad)"/>

  <!-- Rám obrazu na stěně v pozadí -->
  <rect x="40" y="20" width="220" height="280" fill="none" stroke="#cfc5b4" stroke-width="8" rx="4"/>
  <rect x="52" y="32" width="196" height="256" fill="#ded4c3" opacity="0.6"/>

  <!-- Větvičky levandule uvnitř vázy -->
  <g id="lavender" stroke="#52634f" stroke-width="2.5" stroke-linecap="round">
    <path d="M 180 340 Q 170 240 160 140 Q 155 90 145 50" />
    <path d="M 195 350 Q 190 220 185 130 Q 180 80 182 45" />
    <path d="M 210 345 Q 215 230 225 140 Q 235 90 240 55" />
    <path d="M 190 350 Q 205 260 215 170 Q 220 120 222 75" />
    <path d="M 175 350 Q 160 270 150 190 Q 145 130 135 90" />
  </g>

  <!-- Květy levandule (jemné fialové shluky) -->
  <g fill="#7e628c" opacity="0.95">
    <ellipse cx="145" cy="55" rx="7" ry="14" />
    <ellipse cx="148" cy="72" rx="8" ry="15" fill="#694d77"/>
    <ellipse cx="152" cy="90" rx="9" ry="16" fill="#886899"/>
    <ellipse cx="155" cy="110" rx="9" ry="16" />

    <ellipse cx="182" cy="48" rx="8" ry="15" fill="#8d6e9d"/>
    <ellipse cx="183" cy="68" rx="9" ry="16" fill="#6a4d78"/>
    <ellipse cx="185" cy="90" rx="9" ry="17" fill="#7a588a"/>
    <ellipse cx="186" cy="115" rx="9" ry="18" fill="#583c66"/>

    <ellipse cx="240" cy="60" rx="7" ry="14" fill="#866496"/>
    <ellipse cx="236" cy="80" rx="8" ry="15" fill="#724f80"/>
    <ellipse cx="230" cy="102" rx="9" ry="16" fill="#5e3e6c"/>

    <ellipse cx="222" cy="80" rx="8" ry="15" fill="#7a5a8a"/>
    <ellipse cx="218" cy="105" rx="9" ry="16" fill="#8b6c9b"/>
    
    <ellipse cx="135" cy="95" rx="7" ry="14" fill="#684a75"/>
    <ellipse cx="140" cy="115" rx="8" ry="15" fill="#805d90"/>
  </g>

  <!-- Stín vázy na dřevěném stole -->
  <ellipse cx="200" cy="415" rx="140" ry="25" fill="#4d3e2d" opacity="0.45" filter="url(#softGlow)"/>

  <!-- Tělo skleněné azurové vlnité vázy -->
  <!-- Organicky zakřivený tvar dle předlohy -->
  <path d="M 80 280 
           C 110 330, 140 395, 170 410 
           C 200 418, 250 415, 275 400 
           C 310 375, 335 305, 330 250 
           C 325 210, 305 180, 270 195 
           C 225 215, 170 210, 120 230 
           C 95 242, 82 260, 80 280 Z" 
        fill="url(#glassGrad)" />

  <!-- Vnitřní voda a odlesky -->
  <path d="M 98 290 
           C 120 340, 150 390, 175 400 
           C 205 408, 245 402, 265 390 
           C 295 365, 312 305, 305 265 
           C 270 230, 210 225, 140 250 
           C 115 260, 102 275, 98 290 Z" 
        fill="url(#waterHighlight)" opacity="0.8"/>

  <!-- Žebrování na skle (svislé lamely) -->
  <g stroke="url(#glassRib)" stroke-width="4.5" stroke-linecap="round" opacity="0.75">
    <path d="M 105 280 C 120 330, 140 375, 155 400" />
    <path d="M 125 270 C 138 325, 155 375, 172 405" />
    <path d="M 150 260 C 160 320, 175 375, 190 408" />
    <path d="M 175 250 C 182 315, 195 375, 210 408" />
    <path d="M 205 245 C 210 310, 220 370, 235 405" />
    <path d="M 235 240 C 238 300, 250 365, 260 398" />
    <path d="M 265 235 C 268 290, 278 350, 285 385" />
    <path d="M 292 230 C 295 275, 302 330, 305 365" />
    <path d="M 315 245 C 318 280, 318 320, 318 345" />
  </g>

  <!-- Horní zářivý skleněný okraj / křivka -->
  <path d="M 80 280 
           C 105 250, 145 228, 205 220 
           C 260 212, 305 185, 330 250" 
        fill="none" stroke="#90ebff" stroke-width="4" opacity="0.85"/>

  <!-- Bílé akcentní odlesky světla -->
  <path d="M 90 285 C 105 330, 125 370, 150 398" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <ellipse cx="270" cy="235" rx="20" ry="8" fill="#ffffff" opacity="0.4" transform="rotate(-15 270 235)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Pozadí světlé designové místnosti -->
    <linearGradient id="bgRoom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ebe4"/>
      <stop offset="65%" stop-color="#e3dbd0"/>
      <stop offset="68%" stop-color="#c9beaf"/>
      <stop offset="100%" stop-color="#b5a794"/>
    </linearGradient>

    <!-- Bílý keramický/aditivní materiál stojánku -->
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f2efe9"/>
      <stop offset="100%" stop-color="#d4cbbe"/>
    </linearGradient>

    <!-- Tillandsia listy -->
    <linearGradient id="leafGradRed" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4a6344"/>
      <stop offset="60%" stop-color="#a8434a"/>
      <stop offset="100%" stop-color="#d63a46"/>
    </linearGradient>
    
    <linearGradient id="leafGradGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#344a30"/>
      <stop offset="70%" stop-color="#69875f"/>
      <stop offset="100%" stop-color="#a4bd9b"/>
    </linearGradient>

    <radialGradient id="shadowFloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d3328" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3d3328" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Pozadí stěny a desky stolu -->
  <rect width="400" height="480" fill="url(#bgRoom)"/>

  <!-- Stín objektu na stole -->
  <ellipse cx="210" cy="415" rx="140" ry="25" fill="url(#shadowFloor)"/>

  <!-- Organická parametrická buněčná klenba (3D tištěná mřížka) -->
  <!-- Nohy / klenbový oblouk -->
  <path d="M 100 410 
           C 110 330, 130 260, 180 240 
           C 220 225, 270 230, 310 260 
           C 340 285, 360 360, 350 410 
           C 325 410, 305 385, 290 350 
           C 265 300, 220 295, 195 340 
           C 180 370, 150 410, 100 410 Z" 
        fill="url(#ceramicGrad)" stroke="#c2b8aa" stroke-width="1.5"/>

  <!-- Porézní voronoi buňky / otvory v biomorfní struktuře -->
  <g fill="#9c8e7c" opacity="0.65">
    <ellipse cx="140" cy="350" rx="9" ry="14" transform="rotate(-25 140 350)"/>
    <ellipse cx="160" cy="310" rx="12" ry="18" transform="rotate(-15 160 310)"/>
    <ellipse cx="185" cy="275" rx="14" ry="15" />
    <ellipse cx="215" cy="265" rx="15" ry="13" />
    <ellipse cx="245" cy="275" rx="14" ry="17" transform="rotate(20 245 275)"/>
    <ellipse cx="275" cy="310" rx="12" ry="18" transform="rotate(30 275 310)"/>
    <ellipse cx="300" cy="355" rx="10" ry="15" transform="rotate(35 300 355)"/>

    <ellipse cx="165" cy="365" rx="8" ry="12"/>
    <ellipse cx="200" cy="315" rx="13" ry="12"/>
    <ellipse cx="235" cy="315" rx="12" ry="13"/>
    <ellipse cx="268" cy="365" rx="9" ry="12"/>

    <ellipse cx="130" cy="390" rx="7" ry="10"/>
    <ellipse cx="318" cy="390" rx="8" ry="11"/>
  </g>

  <!-- Vrchní plocha stojánku s mikropóry -->
  <ellipse cx="215" cy="235" rx="90" ry="32" fill="#ffffff" stroke="#ded8cc" stroke-width="2"/>
  <g fill="#918473" opacity="0.5">
    <circle cx="160" cy="230" r="5"/>
    <circle cx="178" cy="225" r="6"/>
    <circle cx="195" cy="220" r="7"/>
    <circle cx="215" cy="222" r="8"/>
    <circle cx="235" cy="220" r="7"/>
    <circle cx="255" cy="225" r="6"/>
    <circle cx="272" cy="232" r="5"/>
  </g>

  <!-- Rostlina Tillandsia (červeno-zelená epifytická rostlina s tenkými špičatými listy) -->
  <g stroke-linecap="round">
    <!-- Spodní zelené listy -->
    <path d="M 215 220 Q 170 200 130 215" stroke="url(#leafGradGreen)" stroke-width="4.5" fill="none"/>
    <path d="M 215 220 Q 150 180 120 170" stroke="url(#leafGradGreen)" stroke-width="4" fill="none"/>
    <path d="M 215 220 Q 270 200 310 215" stroke="url(#leafGradGreen)" stroke-width="4.5" fill="none"/>
    <path d="M 215 220 Q 285 180 320 175" stroke="url(#leafGradGreen)" stroke-width="4" fill="none"/>

    <!-- Střední přechodové listy -->
    <path d="M 215 220 Q 170 150 145 130" stroke="url(#leafGradRed)" stroke-width="4" fill="none"/>
    <path d="M 215 220 Q 190 130 170 95" stroke="url(#leafGradRed)" stroke-width="4" fill="none"/>
    <path d="M 215 220 Q 240 140 270 120" stroke="url(#leafGradRed)" stroke-width="4" fill="none"/>
    <path d="M 215 220 Q 255 125 285 95" stroke="url(#leafGradRed)" stroke-width="3.5" fill="none"/>

    <!-- Vrchní zářivě červené listy -->
    <path d="M 215 220 Q 200 110 195 70" stroke="url(#leafGradRed)" stroke-width="3.5" fill="none"/>
    <path d="M 215 220 Q 215 95 212 55" stroke="url(#leafGradRed)" stroke-width="4" fill="none"/>
    <path d="M 215 220 Q 225 100 232 65" stroke="url(#leafGradRed)" stroke-width="3.5" fill="none"/>
    <path d="M 215 220 Q 235 110 250 80" stroke="url(#leafGradRed)" stroke-width="3.5" fill="none"/>
    <path d="M 215 220 Q 195 120 180 85" stroke="url(#leafGradRed)" stroke-width="3.5" fill="none"/>
  </g>
</svg>
